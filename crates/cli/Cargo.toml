[package]
name = "agentkube-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Command-line client for the AgentKube HTTP API"

[[bin]]
name = "akctl"
path = "src/bin/akctl.rs"

[dependencies]
agentkube-agents = { path = "../agents" }
agentkube-core = { path = "../core" }
agentkube-protocol = { path = "../protocol" }
agentkube-tasks = { path = "../tasks" }
clap = { version = "4", features = ["derive"] }
humantime = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
tokio.workspace = true
url = "2"

[dev-dependencies]
agentkube-api = { path = "../api" }
agentkube-queue = { path = "../queue" }
agentkube-storage = { path = "../storage" }
assert_cmd = "2"
axum.workspace = true
predicates = "3"
serde_json.workspace = true
tempfile = "3"
tokio.workspace = true
